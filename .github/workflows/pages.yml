name: Deploy static page
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test and check data
        run: |
          python -m unittest discover -s tests -v
          python -c "import json; d=json.load(open('dist/bonuses.json', encoding='utf-8')); assert len(d['casinos']) == 3; assert all(set(c) == {'casino','welcome_bonus','wagering_requirement','minimum_deposit','source_url'} for c in d['casinos'])"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
